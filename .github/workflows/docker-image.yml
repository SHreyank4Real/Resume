name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: sh-resume
    env:
      TAG=""
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (DD-MM-YYYY-UUID)
        run: echo "TAG=$(date +'%d-%m-%Y')-$(uuidgen)" >> $TAG

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build . \
          --file Dockerfile \
          --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.IMAGENAME }}:${{ env.TAG }}

      - name: Push image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.IMAGENAME }}:${{ env.TAG }}