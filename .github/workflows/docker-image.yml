name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: sh-resume

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (DD-MM-YYYY-UUID)
        run: echo "TAG=$(date +'%d-%m-%Y')-$(uuidgen)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login image.shreyank.in -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          docker build . \
            --file Dockerfile \
            --tag image.shreyank.in/resume/shreyankresume:${{ env.TAG }}

      - name: Push image
        run: docker push image.shreyank.in/resume/shreyankresume:${{ env.TAG }}